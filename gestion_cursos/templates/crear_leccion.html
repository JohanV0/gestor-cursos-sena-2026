{% extends 'layouts/base.html' %}

{%block title%}
Acerca de Nosotros
{%endblock%}

{% block content %}
<div class="w-full max-w-xl bg-dark-purple-900 rounded-2xl shadow-2xl shadow-black/40 border border-dark-purple-800 p-6 md:p-10">
        <div class="flex items-center gap-4 mb-8 border-b border-dark-purple-800 pb-6">
            <div class="w-14 h-14 bg-dark-purple-800/60 border border-dark-purple-700 rounded-xl flex items-center justify-center text-dark-purple-300">
                <i class="fa-solid fa-list-check text-2xl"></i>
            </div>
            <div>
                <span class="text-xs tracking-widest uppercase text-dark-purple-300 block mb-1">
                    タスク — Task Management
                </span>
                <h1 class="text-2xl md:text-3xl font-jp-serif font-light text-white">
                    Agregar leccion a:
                    <span class="text-dark-purple-500">
                        {{ curso.titulo }}
                    </span>
                </h1>
            </div>
        </div>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div class="space-y-1.5">
                <label for="titulo"
                       class="block text-sm font-medium text-dark-purple-300">
                    Titulo de la tarea:
                </label>
                <input type="text"
                       name="titulo"
                       id="titulo"
                       placeholder="Ej. programacion en django"
                       required
                       class="w-full px-4 py-3 bg-dark-purple-950 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-700 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none transition-all">
            </div>
            <div class="space-y-1.5">
                <label for="contenido"
                       class="block text-sm font-medium text-dark-purple-300">
                    Contenido
                </label>
                <input type="text"
                       name="contenido"
                       id="contenido"
                       placeholder="Ej. Se debe realizar la carpeta ...."
                       required
                       class="w-full px-4 py-3 bg-dark-purple-950 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-700 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none transition-all">
            </div>
            <div class="space-y-1.5">
                <label for="duracion"
                       class="block text-sm font-medium text-dark-purple-300">
                    Duracion
                </label>
                <input type="number"
                       name="duracion"
                       id="duracion"
                       placeholder="En horas"
                       required
                       class="w-full px-4 py-3 bg-dark-purple-950 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-700 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none transition-all">
            </div>
            <div class="space-y-1.5">
                <label for="estado"
                       class="block text-sm font-medium text-dark-purple-300">
                    Estado
                </label>
                <select name="estado"
                        id="estado"
                        class="w-full px-4 py-3 bg-dark-purple-950 border border-dark-purple-800 rounded-xl text-dark-purple-100 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none">
                    {% for valor, etiqueta in estado_choices %}
                        <option value="{{ valor }}" {% if valor == 'PENDIENTE' %} selected {% endif %}>
                            {{ etiqueta }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit"
                    class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 bg-dark-purple-500 text-white text-sm font-medium rounded-xl hover:bg-purple-500 transition-all duration-200 shadow-lg shadow-purple-950/30">
                <i class="fa-solid fa-check"></i>
                Guardar
            </button>
        </form>
        <a href="{%url 'ver_curso' curso.id %}">
            <button class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 my-3 0 border-2 border-dark-purple-500 rounded-xl p4 text-sm font-medium rounded-xl hover:bg-purple-800 transition-all duration-200 shadow-lg shadow-purple-950/30">
                Cancelar
            </button>
        </a>
</div>
{% endblock %}
