<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Nuevo Proyecto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-purple': {
                            950: '#0b0614', // Fondo general ultra oscuro
                            900: '#140c24', // Fondo de la tarjeta principal
                            800: '#23153c', // Bordes e interacciones
                            700: '#3a2063',
                            500: '#8b5cf6', // Acento neón
                            300: '#c4b5fd', // Texto secundario
                            100: '#ede9fe', // Texto claro
                        },
                    },
                    fontFamily: {
                        'jp-serif': ['Noto Serif JP', 'serif'],
                        'sans-refined': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .form-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .form-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.15);
        }
        /* Estilo para los campos del nuevos_cursos */
        input, textarea {
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, textarea:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="bg-dark-purple-950 text-dark-purple-100 min-h-screen flex items-center justify-center p-4 md:p-8 antialiased">

    <div class="w-full max-w-2xl bg-dark-purple-900/80 backdrop-blur-sm rounded-3xl shadow-xl shadow-dark-purple-950/50 p-6 md:p-10 border border-dark-purple-800">

        <!-- Cabecera con navegación simple -->
        <div class="flex items-center gap-3 mb-8 border-b border-dark-purple-800 pb-5">
            <div class="bg-dark-purple-800/60 p-3 rounded-xl text-dark-purple-300 border border-dark-purple-700">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div class="flex-1">
                <span class="text-xs tracking-widest uppercase text-dark-purple-300 font-medium block mb-0.5">
                    新規プロジェクト — New Project
                </span>
                <h1 class="text-2xl md:text-3xl font-jp-serif font-light tracking-wide text-white">
                    Nuevo Proyecto
                </h1>
                <p class="text-sm text-dark-purple-300/70 font-light">
                    Completa los campos para crear un nuevo proyecto
                </p>
            </div>
            <!-- Enlace para volver a la lista -->
            <a href="{% url 'cursos' %}" 
               class="inline-flex items-center gap-1.5 px-4 py-2 bg-dark-purple-900 text-dark-purple-300 text-sm font-medium rounded-full border border-dark-purple-800 hover:bg-dark-purple-800 hover:text-white transition-all duration-150">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>
        </div>

        <!-- nuevos_cursos para crear proyecto -->
        <div class="form-card bg-dark-purple-950/60 rounded-2xl p-6 md:p-8 border border-dark-purple-800 shadow-sm">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Campo: Nombre -->
                <div class="space-y-1.5">
                    <label for="id_nombre" class="flex items-center gap-2 text-sm font-semibold text-dark-purple-300">
                        <i class="fa-solid fa-signature"></i>
                        Nombre del proyecto
                    </label>
                    <input type="text" 
                           name="titulo" 
                           value="{{curso.titulo}}"
                           id="id_titulo" 
                           required
                           placeholder="Ej: Desarrollo E-commerce"
                           class="w-full px-4 py-3 bg-dark-purple-950 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-300/30 text-sm focus:border-dark-purple-500 transition-all duration-150" />
                </div>

                <!-- Campo: Descripción -->
                <div class="space-y-1.5">
                    <label for="id_descripcion" class="flex items-center gap-2 text-sm font-semibold text-dark-purple-300">
                        <i class="fa-solid fa-audio-description"></i>
                        Descripción
                    </label>
                    <textarea name="descripcion" 
                              id="id_descripcion" 
                              rows="4"
                              required
                              placeholder="Describe el objetivo y alcance del proyecto..."
                              class="w-full px-4 py-3 bg-dark-purple-950 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-300/30 text-sm focus:border-dark-purple-500 transition-all duration-150 resize-y">{{curso.descripcion}}</textarea>
                    <p class="text-xs text-dark-purple-300/50 mt-1">Máximo 500 caracteres</p>
                </div>

                <!-- Campo: Nivel -->
                <div class="space-y-1.5">
                    <label for="id_nivel" class="flex items-center gap-2 text-sm font-semibold text-dark-purple-300">
                        <i class="fa-regular fa-signal-bars text-dark-purple-500 text-xs"></i>
                        <i class="fa-duotone fa-solid fa-layer"></i>
                        Nivel
                    </label>
                    <select name="nivel" 
                            id="id_nivel" 
                            required
                            class="w-full px-4 py-3 bg-dark-purple-950 border border-dark-purple-800 rounded-xl text-dark-purple-100 text-sm focus:border-dark-purple-500 transition-all duration-150">
                            {{curso.nivel}}
                            <option value="">Selecciona un nivel</option>
                            <option value="Principiante">Principiante</option>
                            <option value="Intermedio">Intermedio</option>
                            <option value="Avanzado">Avanzado</option>
                    </select>
                    <p class="text-xs text-dark-purple-300/50 mt-1">Indica el nivel de dificultad del proyecto</p>
                </div>

                <!-- Acciones del nuevos_cursos -->
                <div class="pt-4 flex flex-col sm:flex-row items-center gap-3 border-t border-dark-purple-800">
                    <button type="submit" 
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-dark-purple-500 text-white text-sm font-medium rounded-full hover:bg-dark-purple-700 transition-all duration-150 shadow-lg shadow-dark-purple-500/20 hover:shadow-dark-purple-500/30">
                        <i class="fa-regular fa-check-circle"></i>
                        Guardar Proyecto
                    </button>
                    <a href="{% url 'cursos' %}"
                       class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-dark-purple-900 text-dark-purple-300 text-sm font-medium rounded-full hover:bg-dark-purple-800 hover:text-white transition-all duration-150 border border-dark-purple-800">
                        <i class="fa-regular fa-xmark-circle"></i>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
